# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Build cache and parallel execution.
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style.
kotlin.code.style=official

# Non-stable releases can break the build; only use stable versions.
kotlin.daemon.jvmargs=-Xmx1280m
